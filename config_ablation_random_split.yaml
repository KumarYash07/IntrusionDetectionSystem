# Ablation (c): Random split instead of block split (measures temporal/neighbouring flow leakage)
data_path: data/Combined.csv
label_col: Attack Type
benign_label: Benign
order_col: null
blocks_per_class: null
group_col: null
time_col: null
drop_cols: [
  'Unnamed: 0', Seq, Offset, Label, Attack Tool, sVid, dVid, SrcTCPBase, DstTCPBase
]
families:
  httpflood: [HTTPFlood]
  slowrate: [SlowrateDoS]
  synflood: [SYNFlood]
  scans: [TCPConnectScan, SYNScan, UDPScan]
holdout_families: [httpflood, slowrate, synflood, scans]
seeds: [1, 2, 3, 4, 5]
test_size: 0.2
val_size: 0.15
select_k: null
models: [rf, lr, hgb, xgb, lgbm]
model: lgbm
anomaly: iforest
class_balance: balanced
known_accept_rate: 0.95
fpr_target: 0.05
max_train_rows: 200000
results_dir: results_ablation_random_split
